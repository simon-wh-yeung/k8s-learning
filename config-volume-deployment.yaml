apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-volume-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-volume-demo
  template:
    metadata:
      labels:
        app: config-volume-demo
    spec:
      containers:
        - name: config-demo
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: app-config-volume
              mountPath: /etc/app-config
              readOnly: true
      volumes:
        - name: app-config-volume
          configMap:
            name: app-config
