apiVersion: apps/v1
kind: Deployment
metadata:
  name: limitrange-demo
  namespace: lesson7e9-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: limitrange-demo
  template:
    metadata:
      labels:
        app: limitrange-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1500m"
              memory: "256Mi"
