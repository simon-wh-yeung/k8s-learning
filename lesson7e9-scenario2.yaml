apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-demo
  namespace: lesson7e9
spec:
  replicas: 4
  selector:
    matchLabels:
      app: quota-demo
  template:
    metadata:
      labels:
        app: quota-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.30
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
