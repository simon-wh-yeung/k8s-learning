apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-config-error
  namespace: lesson5e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-config-error
  template:
    metadata:
      labels:
        app: inventory-config-error
    spec:
      containers:
        - name: inventory
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: LOG_LEVEL
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: DB_HOST
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: inventory-secret
                  key: DB_USERNAME
