apiVersion: v1
kind: Pod
metadata:
  name: config-file-demo
spec:
  containers:
    - name: config-demo
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: app-config-volume
          mountPath: /etc/app-config
          readOnly: true
  volumes:
    - name: app-config-volume
      configMap:
        name: app-config
