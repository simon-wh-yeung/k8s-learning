apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-volume-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-volume-demo
  template:
    metadata:
      labels:
        app: secret-volume-demo
    spec:
      containers:
        - name: secret-demo
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: database-secret-volume
              mountPath: /etc/database-credentials
              readOnly: true
      volumes:
        - name: database-secret-volume
          secret:
            secretName: database-secret
