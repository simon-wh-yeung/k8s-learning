apiVersion: v1
kind: Pod
metadata:
  name: pod-missing-pvc
  namespace: lesson6e
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: pvc-does-not-exist
