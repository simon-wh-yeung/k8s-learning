apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-missing-config
  namespace: lesson5e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-missing-config
  template:
    metadata:
      labels:
        app: inventory-missing-config
    spec:
      containers:
        - name: inventory
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: APP_ENV
