apiVersion: apps/v1
kind: Deployment
metadata:
  name: defaults-demo
  namespace: lesson7e8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: defaults-demo
  template:
    metadata:
      labels:
        app: defaults-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.30
          ports:
            - containerPort: 80
