apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: lesson6
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared-storage
          mountPath: /shared

    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared-storage
          mountPath: /shared

  volumes:
    - name: shared-storage
      emptyDir: {}
