apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-demo
  namespace: lesson6
spec:
  serviceName: stateful-demo
  replicas: 2

  selector:
    matchLabels:
      app: stateful-demo

  template:
    metadata:
      labels:
        app: stateful-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
