apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-file-error
  namespace: lesson5e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-file-error
  template:
    metadata:
      labels:
        app: inventory-file-error
    spec:
      containers:
        - name: inventory
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: inventory-config-volume
              mountPath: /etc/inventory-config
              readOnly: true
      volumes:
        - name: inventory-config-volume
          configMap:
            name: inventory-config
            items:
              - key: APP_ENV
                path: APP_ENV
              - key: DB_HOST
                path: DB_HOST
              - key: LOG_LEVEL
                path: LOG_LEVEL

